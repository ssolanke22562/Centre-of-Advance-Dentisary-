name: dr_patil_dentistry
description: "Cross-platform mobile application for Dr. Patil's Centre of Advance Dentistry"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  csv: ^6.0.0
  share_plus: ^8.0.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
